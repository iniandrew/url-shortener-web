# Additional rule for the existing `api` HTTPRoute (deploy/k8s in the API
# repo): everything under /app goes to the web pods; the API keeps /api and
# the /{code} redirect catch-all.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: web
  namespace: shortener
spec:
  parentRefs:
    - name: public
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /app
      backendRefs:
        - name: web
          port: 80
