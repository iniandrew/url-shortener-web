apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: shortener
  labels:
    app: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: web
          image: ghcr.io/iniandrew/url-shortener-web # tag = git sha, set per release
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 64Mi }
          readinessProbe:
            httpGet: { path: /app/, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /app/, port: http }
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
          volumeMounts:
            - name: tmp
              mountPath: /tmp # caddy needs a writable /tmp
            - name: data
              mountPath: /data
      volumes:
        - name: tmp
          emptyDir: {}
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: shortener
spec:
  selector:
    app: web
  ports:
    - name: http
      port: 80
      targetPort: http
